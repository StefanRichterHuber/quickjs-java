[package]
name = "java-quickjs"
version = "2.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[profile.release]
#opt-level = 'z'
lto = true

[lib]
name = "javaquickjs"
crate-type = ["cdylib"]

[features]
# Enables a workaround, that sets the "C" LC_NUMERIC locale for the current thread while JS code is executed. This is necessary because QuickJS parses
# numbers in JSON.parse with the locale dependent libc strtod <https://github.com/bellard/quickjs/issues/106>. Starting a JVM sets the locale, so on systems
# with ',' as decimal separator (e.g. german systems) JSON.parse('1.5') returns 1 (see <https://github.com/DelSkayn/rquickjs/issues/281>). See src/with_locale.rs
locale_workaround = ["dep:libc"]
default = ["locale_workaround"]

[dependencies]
# All this dump-* features help debugging
rquickjs = { version = "0.14.0", features = [
    #  "dump-objects",
    #  "dump-read-object",
    #  "dump-bytecode",
    # rquickjs-sys ships pre-generated bindings for all targets built here (linux x86_64 / aarch64 / armv7, windows x86_64 gnu).
    # Enable "bindgen" only for other targets: it requires libclang (with its headers) in the cross containers.
    #  "bindgen",
] }
jni = { version = "0.22.4" }
log = { version = "0.4.34", features = ["std"] }
libc = { version = "0.2", optional = true }

[dev-dependencies]
# Invocation feature is necessary for tests to spin up a VM
jni = { version = "0.22.4", features = ["invocation"] }
